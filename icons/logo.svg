<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3d25" />
      <stop offset="55%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#198754" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle Islamic 8-point geometric star frame -->
  <g fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.55">
    <rect x="86" y="86" width="340" height="340" rx="28" />
    <rect x="86" y="86" width="340" height="340" rx="28" transform="rotate(45 256 256)" />
  </g>

  <!-- Inner Glass Circle -->
  <circle cx="256" cy="256" r="154" fill="rgba(255,255,255,0.08)" stroke="url(#gold)" stroke-width="5" />

  <!-- Arabic Letter Qaf / Quranic motif -->
  <text x="256" y="302" text-anchor="middle" font-family="'Geeza Pro', 'Amiri', 'Traditional Arabic', serif" font-size="220" font-weight="bold" fill="#fef3c7">ق</text>

  <!-- Small Gold Accent Dot at bottom -->
  <circle cx="256" cy="430" r="8" fill="url(#gold)" />
</svg>
